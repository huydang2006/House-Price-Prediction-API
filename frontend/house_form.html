<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>House Price Predictor</title>
</head>

<body>

  <h1>House Price Predictor</h1>

  <form id="house-form">

    <label for="area">Area (m2):</label>
    <input type="number" id="area" required>
    <br><br>

    <label for="bedrooms">Bedrooms:</label>
    <input type="number" id="bedrooms" required>
    <br><br>

    <label for="distance">Distance to center (km):</label>
    <input type="number" id="distance" step="0.1" required>
    <br><br>

    <button type="submit">Predict price</button>
  </form>

  <p id="result"></p>

  <script>
    const form = document.getElementById("house-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const area_sqm = Number(document.getElementById("area").value);
      const bedrooms = Number(document.getElementById("bedrooms").value);
      const distance_to_center_km = Number(document.getElementById("distance").value);

      try {
        // POST + JSON body, since /predict/house-price takes a request body now
        const response = await fetch("/predict/house-price", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ area_sqm, bedrooms, distance_to_center_km }),
        });

        if (!response.ok) {
          result.textContent = "Invalid input!";
          return;
        }

        const data = await response.json();
        result.textContent = "Predicted price: " + data.predicted_price.toLocaleString() + " " + data.currency;
      } catch (error) {
        result.textContent = "Something went wrong!";
      }
    });
  </script>

</body>

</html>
